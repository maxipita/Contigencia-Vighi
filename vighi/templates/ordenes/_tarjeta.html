<div class="tarjeta" id="ordenes">
  <h2>Órdenes escaneadas{% if ordenes %} <span class="muted">({{ ordenes | length }})</span>{% endif %}</h2>
  {% if ordenes %}
  <div class="galeria">
    {% for o in ordenes %}
    <figure>
      <a href="{{ url_for('ordenes.orden_ver', oid=o.id) }}" data-visor title="{{ o.nombre or 'Orden' }}{% if o.pagina > 1 %} · página {{ o.pagina }}{% endif %}"><img src="{{ url_for('ordenes.orden_mini', oid=o.id) }}" loading="lazy" alt="Orden"></a>
      <figcaption><div>{{ o.nombre or 'Orden' }}{% if o.pagina > 1 %} · p. {{ o.pagina }}{% endif %}</div><span class="muted">{{ o.iniciales or '?' }} · {{ o.creado_en | fh }}{% if o.metodo %} · {{ {'qr': 'por QR', 'ocr': 'por lectura del número', 'manual': 'a mano', 'continuacion': 'continuación'}.get(o.metodo, o.metodo) }}{% endif %}</span>
        {% if puede('protocolo_editar') %}<form method="post" action="{{ url_for('ordenes.orden_borrar', oid=o.id) }}" data-confirmar="¿Borrar esta orden?">
          <input type="hidden" name="_csrf" value="{{ csrf }}"><button class="enlace" title="Borrar orden">Borrar</button></form>{% endif %}</figcaption>
    </figure>
    {% endfor %}
  </div>
  {% else %}<p class="muted">Todavía no hay órdenes escaneadas. Se adjuntan solas desde <a href="{{ url_for('ordenes.ordenes') }}">Órdenes</a> o a mano acá.</p>{% endif %}
  {% if puede('protocolo_editar') %}
  <form method="post" action="{{ url_for('ordenes.ordenes_subir', pid=pid) }}" enctype="multipart/form-data" class="subida">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <input type="file" name="archivos" accept="application/pdf,image/jpeg,image/png,image/webp,image/tiff" multiple required>
    <div class="acciones"><button class="btn sec">Adjuntar orden</button></div>
  </form>
  {% endif %}
</div>
